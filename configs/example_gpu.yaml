model_id: EleutherAI/pythia-1.4b
checkpoint_dir: checkpoints/pythia_1_4b
device: cuda
implementation: batched

data:
  type: json
  train_path: data/toy/train.jsonl
  validation_path: data/toy/validation.jsonl
  train_split: train
  validation_split: validation
  columns:
    question: question
    steps: steps
    answer: answer

batch_size: 2
learning_rate: 0.0001
weight_decay: 0.0
gradient_accumulation_steps: 8
max_latent_stage: 3
c: 2
epochs_per_stage: [6, 3, 3, 3]

max_length: 512
inference_max_new_tokens: 32
seed: 42
local_files_only: false

model_id: EleutherAI/pythia-160m
output_dir: outputs/pythia160m_entailmentbank_controlled
device: cuda
implementation: batched
gradient_checkpointing: false
precision: fp16
optimizer: adamw8bit
optimizer_eps: 0.00000001

data:

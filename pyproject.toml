[project]
name = "coconut-latent-reasoning"
version = "0.1.0"
description = "A small correctness-first implementation of Coconut latent reasoning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
